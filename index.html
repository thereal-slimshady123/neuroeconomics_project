<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15 Days to Payday — Neuroeconomics Decision Study</title>
  <meta name="description" content="A cozy interactive neuroeconomics study on risk, uncertainty, and financial decisions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2.6">
</head>
<body>

  <!-- Ambient Particle / Grid Canvas -->
  <canvas id="bgCanvas" class="bg-canvas"></canvas>

  <div class="app-shell">

    <!-- Clean Cozy Top Header (No Ticker, No Subtitle, No Emojis, No Subject ID) -->
    <header class="cozy-top-bar" id="topBar">
      <div class="top-bar-brand">
        <span class="brand-geometric-mark">◈</span>
        <div class="brand-text-group">
          <span class="brand-title">15 DAYS TO PAYDAY</span>
          <span class="brand-authors-sub">A project by Parth Dhodapkar and Joshua Koilpillai</span>
        </div>
      </div>

      <div class="top-bar-hud">
        <!-- Theme Mode Switcher -->
        <div class="theme-mode-switch" id="themeSwitch">
          <button type="button" class="theme-btn" id="btnThemeLight" title="Light Mode" onclick="setAppTheme('light')">Light</button>
          <button type="button" class="theme-btn" id="btnThemeDark" title="Dark Mode" onclick="setAppTheme('dark')">Dark</button>
        </div>

        <div class="day-badge-pill" id="dayPill">START</div>
        <div class="progress-pill-track">
          <div class="progress-pill-fill" id="progressBarInner" style="width: 0%"></div>
        </div>
      </div>
    </header>

    <!-- Main Stacked Container (Centered on desktop, responsive on mobile) -->
    <div class="cozy-app-container">

      <!-- TOP STAGE: Scene Illustration + Pop-up Jorgan + Speech Bubble -->
      <section class="stage-section" id="stageSection">
        
        <!-- Illustration Canvas / Frame -->
        <div class="scene-stage-frame" id="sceneFrame">
          <!-- Rendered by sprites.js -->
        </div>

        <!-- Jorgan & Speech Bubble Overlay -->
        <div class="mascot-bar" id="mascotBar">
          <div class="mascot-companion pop-bounce" id="mascotCompanion">
            <!-- Rendered by sprites.getJorgan() -->
          </div>

          <div class="mascot-speech-bubble" id="speechBubble">
            <span class="bubble-tag" id="mascotTag">JORGAN</span>
            <p class="bubble-text" id="narratorText">
              Welcome to 15 Days to Payday. I'm Jorgan, your senior portfolio advisor. Let's see how your instincts handle the market.
            </p>
          </div>
        </div>

      </section>

      <!-- BOTTOM CARD: Cozy Questionnaire Container -->
      <main class="questionnaire-card" id="questionnaireCard" role="main">
        <!-- Top pull bar handle for that cozy tactile card aesthetic -->
        <div class="card-handle-bar"></div>
        <div id="rightPanel" class="card-inner-body">
          <!-- Rendered dynamically by js/game.js -->
        </div>
      </main>

    </div>

  </div>

  <!-- Presentation / Developer Stage Skipper Dock -->
  <div class="presentation-dock" id="presentationDock">
    <div class="presentation-bar-inner">
      <div class="presentation-header">
        <span class="presentation-title-text">⚡ Presentation Navigator</span>
        <button type="button" class="dock-close-btn" onclick="togglePresentationDock()">✕ Close</button>
      </div>
      <div class="presentation-chips-wrap">
        <button type="button" class="p-chip" onclick="app.renderConsent()">Consent</button>
        <button type="button" class="p-chip" onclick="app.devJumpPinky()">Pinky Swear</button>
        <button type="button" class="p-chip" onclick="app.devJumpProfile()">Profile</button>
        <button type="button" class="p-chip" onclick="app.devJumpHoltLaury()">Holt-Laury</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(1)">Day 1</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(2)">Day 2</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(3)">Day 3</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(4)">Day 4</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(5)">Day 5 (Urns)</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(6)">Day 6 (1000-7)</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(7)">Day 7 (Loss)</button>
        <button type="button" class="p-chip p-chip-alert" onclick="app.devJumpDay(8)">Day 8 (Crash)</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(9)">Day 9 (Freedom)</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(10)">Day 10</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(11)">Day 11</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(12)">Day 12</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(13)">Day 13</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(14)">Day 14</button>
        <button type="button" class="p-chip" onclick="app.devJumpDay(15)">Day 15</button>
        <button type="button" class="p-chip" onclick="app.devJumpPostGame()">Post-Game</button>
        <button type="button" class="p-chip p-chip-highlight" onclick="app.devJumpResults()">★ Final Card &amp; Debrief</button>
      </div>
    </div>
  </div>

  <!-- Presentation Floating Launcher Pill -->
  <button type="button" class="presentation-launcher-btn" id="presentationLauncher" onclick="togglePresentationDock()">
    ⚡ Skip Stages
  </button>

  <script>
    // Theme Manager
    function setAppTheme(theme) {
      if (theme === 'system') {
        const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
      localStorage.setItem('payday_theme', theme);
      updateThemeButtons(theme);
    }

    function updateThemeButtons(current) {
      const bLight = document.getElementById('btnThemeLight');
      const bDark = document.getElementById('btnThemeDark');
      if (bLight && bDark) {
        bLight.classList.toggle('active', current === 'light');
        bDark.classList.toggle('active', current === 'dark');
      }
    }

    // Initialize theme from storage or system
    (function() {
      const saved = localStorage.getItem('payday_theme') || 'light';
      setAppTheme(saved);
    })();

    // Toggle Presentation Dock
    function togglePresentationDock() {
      const dock = document.getElementById('presentationDock');
      const launcher = document.getElementById('presentationLauncher');
      if (dock && launcher) {
        dock.classList.toggle('active');
        launcher.classList.toggle('hidden', dock.classList.contains('active'));
      }
    }
  </script>

  <script src="js/config.js?v=2.7"></script>
  <script src="js/sprites.js?v=2.7"></script>
  <script src="js/scenarios.js?v=2.7"></script>
  <script src="js/world.js?v=2.7"></script>
  <script src="js/game.js?v=2.7"></script>

</body>
</html>
